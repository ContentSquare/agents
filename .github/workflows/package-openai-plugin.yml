name: Package OpenAI plugin

on:
  push:
    branches: [main]
    paths:
      - plugins/contentsquare/**
      - scripts/package-openai-plugin.sh
      - scripts/check-openai-zip.sh
      - .github/workflows/package-openai-plugin.yml
  pull_request:
    paths:
      - plugins/contentsquare/**
      - scripts/package-openai-plugin.sh
      - scripts/check-openai-zip.sh
      - .github/workflows/package-openai-plugin.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and check OpenAI plugin ZIP
        run: bash scripts/package-openai-plugin.sh

  publish:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-openai-plugin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      # A release keeps the ZIP downloadable as-is; workflow artifacts are re-zipped on download.
      # A published version is never replaced, because it may already be the one submitted to OpenAI.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version plugins/contentsquare/plugin.json)"
          tag="contentsquare-openai-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists. Bump the version in plugins/contentsquare/plugin.json to publish a new ZIP."
            exit 0
          fi
          zip_path="$(bash scripts/package-openai-plugin.sh)"
          gh release create "$tag" "$zip_path" \
            --target "$GITHUB_SHA" \
            --title "Contentsquare OpenAI plugin v${version}" \
            --notes "Upload this ZIP to the OpenAI plugin submission portal."
